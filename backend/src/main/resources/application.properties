spring.application.name=askrepo-backend

# Loads src/main/resources/.env (KEY=VALUE, properties syntax) as extra config, if present.
# Uses classpath (not a CWD-relative file path) so it resolves the same no matter how/where the app is launched from.
spring.config.import=optional:classpath:.env[.properties]

spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring AI - Google Gemini (Gemini Developer API, via API key)
# Reads the key from the GEMINI_API_KEY environment variable; app fails fast if unset.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.6-flash
# Embedding module uses its own connection prefix — must be set even if the chat one is set
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.model=text-embedding-004


# Only enable the model types you actually use. Flip to `none` to disable a model.
spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none


#server.servlet.context-path=/api

# spring.jpa.defer-datasource-initialization=true
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:data.sql

#Qdrant vector store
# Host must be the bare hostname (no https:// scheme, no port) of your Qdrant Cloud cluster.
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:}
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY:}
spring.ai.vectorstore.qdrant.use-tls=true
spring.ai.vectorstore.qdrant.collection-name=askrepo_chunks_v2
spring.ai.vectorstore.qdrant.initialize-schema=true
#Github 0auth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Iv23lib2qiaKdKyNrzVP}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:9dad7bcaa4b3e08084153139e1e222a5438c5026}
spring.security.oauth2.client.registration.github.scope=read:user,user:email,repo
spring.security.oauth2.client.registration.github.user-name-attribute=id

server.servlet.session.cookie.name=ASKREPO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

#app settings
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:prod_dev_encrypted_key_changed_by_jr}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:5a1b2c3d4e5f6a7b}
app.indexing.max-file-bytes=102400
app.indexing.chunk.size=800
app.indexing.chunk.overlap=100
app.github.api-delay-ms=50
